name: Release

on:
  push:
    tags:
      - v*

env:
  SMOO_PATH: ./SMOO/SMOO.csproj
  UPDATER_PATH: ./SMOO.Updater/SMOO.Updater.csproj

# Potential TODO: Test app before publishing

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copy repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish SMOO
        run: dotnet publish $SMOO_PATH -c Release -r win-x64 --self-contained false -p:Version=${GITHUB_REF_NAME#v} -p:DebugType=none -o output/win-x64

      - name: Publish Updater
        run: dotnet publish $UPDATER_PATH -c Release -r win-x64 --self-contained false -p:Version=${GITHUB_REF_NAME#v} -p:DebugType=none -o output/win-x64

      - name: Zip the output
        run: cd output/win-x64 && zip -r ../../SMOO-win-x64.zip .

      - name: Release the output
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" SMOO-win-x64.zip --notes "Release $GITHUB_REF_NAME"